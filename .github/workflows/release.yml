name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > app/release.keystore
            echo "Release keystore decoded successfully."
          else
            echo "::warning::No release keystore secret found (SIGNING_KEY). Falling back to debug signing."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease

      - name: Prepare APK for Release
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found in release output directory!"
            exit 1
          fi
          RELEASE_APK="app/build/outputs/apk/release/listentube-${{ github.ref_name }}.apk"
          cp "$APK_PATH" "$RELEASE_APK"
          echo "RELEASE_APK=$RELEASE_APK" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_APK }}
          name: ListenTube ${{ github.ref_name }}
          generate_release_notes: true

      - name: Notify F-Droid Repo
        continue-on-error: true
        env:
          PAT: ${{ secrets.FDROID_REPO_PAT }}
        run: |
          if [ -n "$PAT" ]; then
            echo "Dispatching update-repo event to theviber707/fdroid-repo..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $PAT" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "User-Agent: GitHub-Actions" \
              https://api.github.com/repos/theviber707/fdroid-repo/dispatches \
              -d "{\"event_type\":\"update-repo\",\"client_payload\":{\"tag\":\"${{ github.ref_name }}\"}}")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Successfully notified fdroid-repo (HTTP $HTTP_CODE)."
            else
              echo "::warning::Failed to notify fdroid-repo (HTTP $HTTP_CODE): $BODY"
              echo "F-Droid repo update will run on its next scheduled poll or manual workflow run."
            fi
          else
            echo "Note: Secret FDROID_REPO_PAT is not set. F-Droid repo update will run on its next scheduled poll or manual workflow run."
          fi
